<div class="card">
  <!-- Панель инструментов -->
  <p-toolbar styleClass="mb-4 gap-2">
    <ng-template pTemplate="left">
      <p-button
        label="New Medicine"
        icon="pi pi-plus"
        severity="success"
        styleClass="mr-2"
        pTooltip="Add new item to inventory"
        tooltipPosition="bottom"
      ></p-button>
      <p-button
        label="Delete"
        icon="pi pi-trash"
        severity="danger"
        [disabled]="true"
      ></p-button>
    </ng-template>

    <ng-template pTemplate="right">
      <p-button icon="pi pi-refresh" [rounded]="true" [text]="true" (onClick)="loadMedicines()" pTooltip="Refresh Data"></p-button>
      <p-button icon="pi pi-upload" [rounded]="true" [text]="true" severity="help" pTooltip="Export"></p-button>
    </ng-template>
  </p-toolbar>

  <!-- Таблица -->
  <p-table
    #dt
    [value]="medicines"
    [rows]="10"
    [paginator]="true"
    [globalFilterFields]="['name', 'manufacturer', 'description']"
    [tableStyle]="{ 'min-width': '75rem' }"
    [rowHover]="true"
    dataKey="id"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    [showCurrentPageReport]="true"
    [loading]="loading"
  >
    <ng-template pTemplate="caption">
      <div class="flex align-items-center justify-content-between">
        <h5 class="m-0 text-xl font-semibold">Inventory Management</h5>
        <span class="p-input-icon-left">
                    <i class="pi pi-search"></i>
          <!-- Обрати внимание на ($event.target).value - это важно для поиска -->
                    <input
                      pInputText
                      type="text"
                      (input)="dt.filterGlobal($any($event.target).value, 'contains')"
                      placeholder="Search..."
                    />
                </span>
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th style="width: 4rem">
          <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
        </th>
        <th pSortableColumn="name" style="min-width:15rem">Name <p-sortIcon field="name"></p-sortIcon></th>
        <th pSortableColumn="manufacturer">Manufacturer <p-sortIcon field="manufacturer"></p-sortIcon></th>
        <th pSortableColumn="price">Price <p-sortIcon field="price"></p-sortIcon></th>
        <th pSortableColumn="quantity">Status <p-sortIcon field="quantity"></p-sortIcon></th>
        <th style="min-width:10rem">Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-medicine>
      <tr>
        <td>
          <p-tableCheckbox [value]="medicine"></p-tableCheckbox>
        </td>
        <td class="font-bold">{{ medicine.name }}</td>
        <td>{{ medicine.manufacturer }}</td>
        <td>{{ medicine.price | currency:'USD' }}</td>
        <td>
          <p-tag
            [value]="getStatus(medicine.quantity)"
            [severity]="getSeverity(medicine.quantity)"
          ></p-tag>
          <span class="ml-2 text-sm text-500">({{medicine.quantity}} pcs)</span>
        </td>
        <td>
          <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="secondary" styleClass="mr-2"></p-button>
          <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger"></p-button>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="summary">
      <div class="flex align-items-center justify-content-between">
        In total there are {{ medicines ? medicines.length : 0 }} medicines.
      </div>
    </ng-template>
  </p-table>
</div>
