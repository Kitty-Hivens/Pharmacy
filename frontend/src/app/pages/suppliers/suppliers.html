<div class="card">
  <p-toast></p-toast>

  <p-toolbar styleClass="mb-4 gap-2">
    <ng-template pTemplate="left">
      <p-button
        label="New Supplier"
        icon="pi pi-plus"
        severity="success"
        (onClick)="openNew()">
      </p-button>
    </ng-template>

    <ng-template pTemplate="right">
      <p-button
        icon="pi pi-refresh"
        [rounded]="true"
        [text]="true"
        (onClick)="loadSuppliers()">
      </p-button>
    </ng-template>
  </p-toolbar>

  <p-table
    #dt
    [value]="suppliers"
    [rows]="10"
    [paginator]="true"
    [globalFilterFields]="['name', 'contactPerson', 'email', 'phone']"
    [tableStyle]="{ 'min-width': '60rem' }"
    [rowHover]="true"
    dataKey="id"
    [loading]="loading"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    [showCurrentPageReport]="true">

    <ng-template pTemplate="caption">
      <div class="flex align-items-center justify-content-between">
        <h5 class="m-0 text-xl font-semibold">Supplier Directory</h5>
        <span class="p-input-icon-left">
          <i class="pi pi-search"></i>
          <input
            pInputText
            type="text"
            (input)="dt.filterGlobal($any($event.target).value, 'contains')"
            placeholder="Search..."
          />
        </span>
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th style="width: 4rem"></th>
        <th pSortableColumn="name">
          Company
          <p-sortIcon field="name"></p-sortIcon>
        </th>
        <th pSortableColumn="contactPerson">
          Contact Person
          <p-sortIcon field="contactPerson"></p-sortIcon>
        </th>
        <th>Email</th>
        <th>Phone</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-supplier>
      <tr>
        <td>
          <p-avatar
            [label]="getInitials(supplier.name)"
            shape="circle"
            styleClass="bg-blue-100 text-blue-700 font-bold">
          </p-avatar>
        </td>
        <td class="font-bold">{{ supplier.name }}</td>
        <td>{{ supplier.contactPerson || '-' }}</td>
        <td>
          <a
            *ngIf="supplier.email"
            [href]="'mailto:' + supplier.email"
            class="text-primary no-underline">
            {{ supplier.email }}
          </a>
          <span *ngIf="!supplier.email" class="text-500">-</span>
        </td>
        <td>{{ supplier.phone || '-' }}</td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="text-center p-6">
          <i class="pi pi-inbox text-500 text-6xl mb-3"></i>
          <div class="text-500 font-medium text-xl">No suppliers found</div>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog
    [(visible)]="supplierDialog"
    [style]="{width: '450px'}"
    header="New Supplier"
    [modal]="true"
    styleClass="p-fluid">

    <ng-template pTemplate="content">
      <div class="field mb-3">
        <label for="name">Company Name</label>
        <input
          type="text"
          pInputText
          id="name"
          [(ngModel)]="supplier.name"
          required
          autofocus
        />
        <small class="p-error" *ngIf="submitted && !supplier.name">
          Company name is required.
        </small>
      </div>

      <div class="field mb-3">
        <label for="contactPerson">Contact Person</label>
        <input
          type="text"
          pInputText
          id="contactPerson"
          [(ngModel)]="supplier.contactPerson"
        />
      </div>

      <div class="field mb-3">
        <label for="email">Email</label>
        <input
          type="email"
          pInputText
          id="email"
          [(ngModel)]="supplier.email"
          placeholder="supplier@example.com"
        />
      </div>

      <div class="field mb-3">
        <label for="phone">Phone</label>
        <input
          type="text"
          pInputText
          id="phone"
          [(ngModel)]="supplier.phone"
          placeholder="+380991234567"
        />
      </div>
    </ng-template>

    <ng-template pTemplate="footer">
      <p-button
        label="Cancel"
        icon="pi pi-times"
        [text]="true"
        (onClick)="hideDialog()">
      </p-button>
      <p-button
        label="Save"
        icon="pi pi-check"
        [text]="true"
        (onClick)="saveSupplier()">
      </p-button>
    </ng-template>
  </p-dialog>
</div>
