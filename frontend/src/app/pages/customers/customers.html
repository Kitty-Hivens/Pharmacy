<div class="card">
  <p-toast></p-toast>
  <p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>

  <p-toolbar styleClass="mb-4 gap-2">
    <ng-template pTemplate="left">
      <p-button
        label="New Customer"
        icon="pi pi-plus"
        severity="success"
        (onClick)="openNew()">
      </p-button>
    </ng-template>

    <ng-template pTemplate="right">
      <p-button
        icon="pi pi-refresh"
        [rounded]="true"
        [text]="true"
        (onClick)="loadCustomers()">
      </p-button>
    </ng-template>
  </p-toolbar>

  <p-table
    #dt
    [value]="customers"
    [rows]="10"
    [paginator]="true"
    [globalFilterFields]="['firstName', 'lastName', 'phone']"
    [tableStyle]="{ 'min-width': '60rem' }"
    [rowHover]="true"
    dataKey="id"
    [loading]="loading"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    [showCurrentPageReport]="true">

    <ng-template pTemplate="caption">
      <div class="flex align-items-center justify-content-between">
        <h5 class="m-0 text-xl font-semibold">Customer Management</h5>
        <span class="p-input-icon-left">
          <i class="pi pi-search"></i>
          <input
            pInputText
            type="text"
            (input)="dt.filterGlobal($any($event.target).value, 'contains')"
            placeholder="Search..."
          />
        </span>
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th style="width: 4rem"></th>
        <th pSortableColumn="firstName">
          Name
          <p-sortIcon field="firstName"></p-sortIcon>
        </th>
        <th pSortableColumn="phone">
          Phone
          <p-sortIcon field="phone"></p-sortIcon>
        </th>
        <th pSortableColumn="discountRate">
          Discount
          <p-sortIcon field="discountRate"></p-sortIcon>
        </th>
        <th style="min-width:12rem">Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-customer>
      <tr>
        <td>
          <p-avatar
            [label]="getInitials(customer.firstName, customer.lastName)"
            shape="circle"
            class="bg-primary text-white font-bold">
          </p-avatar>
        </td>
        <td>
          <div class="font-bold">{{ customer.firstName }} {{ customer.lastName }}</div>
        </td>
        <td>{{ customer.phone }}</td>
        <td>
          <p-tag
            [value]="customer.discountRate + '%'"
            [severity]="getDiscountSeverity(customer.discountRate)">
          </p-tag>
        </td>
        <td>
          <p-button
            icon="pi pi-pencil"
            [rounded]="true"
            [text]="true"
            severity="secondary"
            styleClass="mr-1"
            (onClick)="editCustomer(customer)">
          </p-button>
          <p-button
            icon="pi pi-trash"
            [rounded]="true"
            [text]="true"
            severity="danger"
            (onClick)="deleteCustomer(customer)">
          </p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog
    [(visible)]="customerDialog"
    [style]="{width: '450px'}"
    [header]="(customer.id ? 'Edit Customer' : 'New Customer')"
    [modal]="true"
    styleClass="p-fluid">

    <ng-template pTemplate="content">
      <div class="field mb-3">
        <label for="firstName">First Name</label>
        <input
          type="text"
          pInputText
          id="firstName"
          [(ngModel)]="customer.firstName"
          required
          autofocus
        />
        <small class="p-error" [@if]="submitted && !customer.firstName">
          First name is required.
        </small>
      </div>

      <div class="field mb-3">
        <label for="lastName">Last Name</label>
        <input
          type="text"
          pInputText
          id="lastName"
          [(ngModel)]="customer.lastName"
          required
        />
        <small class="p-error" [@if]="submitted && !customer.lastName">
          Last name is required.
        </small>
      </div>

      <div class="field mb-3">
        <label for="phone">Phone</label>
        <input
          type="text"
          pInputText
          id="phone"
          [(ngModel)]="customer.phone"
          required
          placeholder="+380991234567"
        />
        <small class="p-error" [@if]="submitted && !customer.phone">
          Phone is required.
        </small>
      </div>

      <div class="field mb-3">
        <label for="discount">Discount Rate (%)</label>
        <p-inputNumber
          id="discount"
          [(ngModel)]="customer.discountRate"
          [min]="0"
          [max]="100"
          suffix="%"
          [showButtons]="true">
        </p-inputNumber>
        <small class="p-error" [@if]="submitted && customer.discountRate === undefined">
          Discount is required.
        </small>
      </div>
    </ng-template>

    <ng-template pTemplate="footer">
      <p-button
        label="Cancel"
        icon="pi pi-times"
        [text]="true"
        (onClick)="hideDialog()">
      </p-button>
      <p-button
        label="Save"
        icon="pi pi-check"
        [text]="true"
        (onClick)="saveCustomer()">
      </p-button>
    </ng-template>
  </p-dialog>
</div>
