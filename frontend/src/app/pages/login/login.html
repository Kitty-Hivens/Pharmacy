<div class="flex min-h-screen">
  <div class="hidden lg:flex w-6 flex-column justify-content-between align-items-center px-6 py-6 bg-primary-reverse"
       style="background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%);">

    <div class="flex align-items-center gap-2">
      <i class="pi pi-heart-fill text-2xl text-white"></i>
      <span class="text-xl font-bold text-white">Haru Pharmacy</span>
    </div>

    <div class="flex flex-column align-items-center gap-3 text-center">
      <h1 class="text-5xl font-bold text-white m-0">{{ 'LOGIN.BRANDING_TITLE' | translate }}</h1>
      <p class="text-white-alpha-90 text-xl m-0 line-height-3 max-w-30rem">
        {{ 'LOGIN.BRANDING_SUBTITLE' | translate }}
      </p>
    </div>

    <div class="text-white-alpha-70 text-sm">
      © 2026 Haru Dev.
    </div>
  </div>

  <div class="w-full lg:w-6 flex align-items-center justify-content-center p-6 surface-card">
    <div class="w-full max-w-25rem">

      <div class="flex justify-content-end mb-5 gap-2">
        <span class="cursor-pointer text-sm font-medium"
              [class.text-primary]="translate.currentLang === 'en'"
              [class.text-500]="translate.currentLang !== 'en'"
              (click)="switchLanguage('en')">EN</span>
        <span class="text-300">|</span>
        <span class="cursor-pointer text-sm font-medium"
              [class.text-primary]="translate.currentLang === 'ru'"
              [class.text-500]="translate.currentLang !== 'ru'"
              (click)="switchLanguage('ru')">RU</span>
      </div>

      <div class="text-center mb-5">
        <div class="text-900 text-3xl font-medium mb-3">{{ 'LOGIN.TITLE' | translate }}</div>
        <span class="text-600 font-medium line-height-3">{{ 'LOGIN.NO_ACCOUNT' | translate }}</span>
        <a href="mailto:admin@pharmacy.com?subject=Account Request" class="font-medium no-underline ml-2 text-blue-500 cursor-pointer">{{ 'LOGIN.CONTACT_ADMIN' | translate }}</a>
      </div>

      <div>
        <label for="username" class="block text-900 font-medium mb-2">{{ 'LOGIN.USERNAME' | translate }}</label>
        <input id="username" type="text" pInputText [(ngModel)]="authRequest.username" class="w-full mb-3" style="padding:1rem">

        <label for="password" class="block text-900 font-medium mb-2">{{ 'LOGIN.PASSWORD' | translate }}</label>
        <p-password id="password" [(ngModel)]="authRequest.password" [toggleMask]="true" [feedback]="false" styleClass="w-full mb-3" inputStyleClass="w-full" [style]="{'padding':'0'}"></p-password>

        <div class="flex align-items-center justify-content-between mb-6">
          <div class="flex align-items-center">
            <p-checkbox id="rememberme" [binary]="true" styleClass="mr-2"></p-checkbox>
            <label for="rememberme" class="text-900">{{ 'LOGIN.REMEMBER_ME' | translate }}</label>
          </div>
          <a href="mailto:admin@pharmacy.com?subject=Password Reset Request" class="font-medium no-underline ml-2 text-blue-500 text-right cursor-pointer">{{ 'LOGIN.FORGOT_PASSWORD' | translate }}</a>
        </div>

        <p-button [label]="'LOGIN.SIGN_IN' | translate" (onClick)="login()" [loading]="loading" styleClass="w-full p-3 text-lg"></p-button>

        <div *ngIf="errorMessage" class="mt-4">
          <p-message severity="error" [text]="errorMessage | translate" styleClass="w-full"></p-message>
        </div>
      </div>
    </div>
  </div>
</div>
