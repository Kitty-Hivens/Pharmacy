<!-- Статистика (Карточки) -->
<div class="grid mb-4">

  <!-- Card 1 -->
  <div class="col-12 md:col-6 lg:col-3">
    <div class="surface-card shadow-1 p-3 border-round h-full">
      <div class="flex justify-content-between mb-3">
        <div>
          <span class="block text-500 font-medium mb-3">Total Sales</span>
          <div class="text-900 font-medium text-xl">$45,200</div>
        </div>
        <div class="flex align-items-center justify-content-center bg-blue-100 border-round" style="width:2.5rem;height:2.5rem">
          <i class="pi pi-shopping-bag text-blue-500 text-xl"></i>
        </div>
      </div>
      <span class="text-green-500 font-medium">+15% </span>
      <span class="text-500">since last month</span>
    </div>
  </div>

  <!-- Card 2 -->
  <div class="col-12 md:col-6 lg:col-3">
    <div class="surface-card shadow-1 p-3 border-round h-full">
      <div class="flex justify-content-between mb-3">
        <div>
          <span class="block text-500 font-medium mb-3">Customers</span>
          <div class="text-900 font-medium text-xl">2,450</div>
        </div>
        <div class="flex align-items-center justify-content-center bg-orange-100 border-round" style="width:2.5rem;height:2.5rem">
          <i class="pi pi-users text-orange-500 text-xl"></i>
        </div>
      </div>
      <span class="text-green-500 font-medium">+5% </span>
      <span class="text-500">new registrations</span>
    </div>
  </div>

  <!-- Card 3 -->
  <div class="col-12 md:col-6 lg:col-3">
    <div class="surface-card shadow-1 p-3 border-round h-full">
      <div class="flex justify-content-between mb-3">
        <div>
          <span class="block text-500 font-medium mb-3">Low Stock</span>
          <div class="text-900 font-medium text-xl">15 Items</div>
        </div>
        <div class="flex align-items-center justify-content-center bg-red-100 border-round" style="width:2.5rem;height:2.5rem">
          <i class="pi pi-exclamation-triangle text-red-500 text-xl"></i>
        </div>
      </div>
      <span class="text-red-500 font-medium">Action Needed </span>
    </div>
  </div>

  <!-- Card 4 -->
  <div class="col-12 md:col-6 lg:col-3">
    <div class="surface-card shadow-1 p-3 border-round h-full">
      <div class="flex justify-content-between mb-3">
        <div>
          <span class="block text-500 font-medium mb-3">Messages</span>
          <div class="text-900 font-medium text-xl">152 Unread</div>
        </div>
        <div class="flex align-items-center justify-content-center bg-purple-100 border-round" style="width:2.5rem;height:2.5rem">
          <i class="pi pi-comment text-purple-500 text-xl"></i>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Таблица (Секция) -->
<div class="grid">
  <div class="col-12 lg:col-8">
    <div class="surface-card shadow-1 border-round p-4">
      <div class="flex align-items-center justify-content-between mb-4">
        <h5 class="m-0 text-xl">Recent Transactions</h5>
        <p-button icon="pi pi-ellipsis-v" [text]="true" [rounded]="true" severity="secondary"></p-button>
      </div>

      <p-table [value]="recentSales" [tableStyle]="{'min-width': '30rem'}">
        <ng-template pTemplate="header">
          <tr>
            <th>Product</th>
            <th>Date</th>
            <th>Amount</th>
            <th>Status</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-sale>
          <tr>
            <td>{{sale.product}}</td>
            <td>{{sale.date}}</td>
            <td>{{sale.amount | currency:'USD'}}</td>
            <td>
              <span [class]="'p-badge p-badge-' + getSeverity(sale.status)">{{sale.status}}</span>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>

  <div class="col-12 lg:col-4">
    <div class="surface-card shadow-1 border-round p-4 h-full">
      <div class="flex align-items-center justify-content-between mb-4">
        <h5 class="m-0 text-xl">Quick Actions</h5>
      </div>
      <div class="flex flex-column gap-3">
        <button pButton label="New Sale (POS)" icon="pi pi-plus" class="p-button-outlined w-full"></button>
        <button pButton label="Add Medicine" icon="pi pi-box" class="p-button-outlined p-button-secondary w-full"></button>
        <button pButton label="Register Customer" icon="pi pi-user-plus" class="p-button-outlined p-button-info w-full"></button>
      </div>
    </div>
  </div>
</div>
