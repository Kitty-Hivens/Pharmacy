services:
  backend:
    build: ./backend
    container_name: pharmacy-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mariadb://db:3306/pharmacy_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - JWT_SECRET=MySuperSecretKeyForDockerComposeThatIsSecure123
      - SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_BATCH_FETCH_SIZE=50
      # Explicitly setting CORS to prove the env var works
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:4200,http://localhost:80,http://127.0.0.1:80,http://localhost,http://127.0.0.1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pharmacy-network

  frontend:
    build: ./frontend
    container_name: pharmacy-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pharmacy-network

  db:
    image: mariadb:10.11  # Pinned version for stability instead of 'latest'
    container_name: pharmacy-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pharmacy_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pharmacy-network

networks:
  pharmacy-network:
    driver: bridge

volumes:
  db_data:
