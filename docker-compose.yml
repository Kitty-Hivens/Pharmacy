services:
  backend:
    build: ./backend
    container_name: pharmacy-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mariadb://db:3306/pharmacy_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - JWT_SECRET=MySuperSecretKeyForDockerComposeThatIsSecure123
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pharmacy-network

  db:
    image: mariadb:latest
    container_name: pharmacy-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pharmacy_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pharmacy-network

networks:
  pharmacy-network:
    driver: bridge

volumes:
  db_data:
