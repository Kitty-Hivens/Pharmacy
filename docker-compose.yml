services:
  # --- Backend (Spring Boot) ---
  backend:
    build: ./backend
    container_name: pharmacy-backend
    restart: always
    environment:
      - DB_URL=jdbc:mariadb://db:3306/${DB_DATABASE}
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_BATCH_FETCH_SIZE=50
      # Explicitly setting CORS to prove the env var works
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pharmacy-network

  # --- Frontend (Angular + Nginx) ---
  frontend:
    build: ./frontend
    container_name: pharmacy-frontend
    restart: always
    ports:
      - "${APP_PORT}:80"
    depends_on:
      - backend
    networks:
      - pharmacy-network

  # --- Database (MariaDB) ---
  db:
    image: mariadb:10.11  # Pinned version for stability instead of 'latest'
    container_name: pharmacy-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pharmacy-network

networks:
  pharmacy-network:
    driver: bridge

volumes:
  db_data:
